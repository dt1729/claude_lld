<!doctype html>
<!--
  One frame of the lld-seed demo. The scene data is injected at the marker near the bottom
  of this file and rendered client side, so the design lives in CSS rather than in drawing
  coordinates.

  The marker is deliberately not quoted anywhere above: the injector replaces its first
  occurrence, and naming it here once put the script inside this comment instead.

  Palette and type stacks are taken from dt1729.github.io (_sass/_variables.scss): the
  Paper/Ink themes, hairline rules instead of shadows, neutral greys rather than blue-tinted.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #151515;
    --surface: #212121;
    --fg: #e6e6e6;
    --muted: #9a9a9a;
    --rule: #2a2a2a;
    --rule-hard: #3d3d3d;
    --accent: #82adea;
    --code-bg: #1c1c1c;
    --deny: #d1595c;
    --allow: #7fb069;

    --serif: Charter, "Bitstream Charter", Georgia, "Times New Roman", serif;
    --sans: "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif;
    --mono: Consolas, ui-monospace, SFMono-Regular, Menlo, "Liberation Mono", monospace;
  }
  :root[data-theme="light"] {
    --bg: #fbfaf8;
    --surface: #f1efeb;
    --fg: #14171c;
    --muted: #5a6472;
    --rule: #dfe1e6;
    --rule-hard: #c4c8cf;
    --accent: #1a5fb4;
    --code-bg: #f2f2ef;
    --deny: #b3282b;
    --allow: #3f7d20;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 720px;
    background: var(--bg); color: var(--fg);
    font-family: var(--sans);
    display: flex; flex-direction: column;
    padding: 56px 72px 48px;
  }

  header { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--rule); padding-bottom: 18px; }
  .wordmark { font-family: var(--mono); font-size: 22px; letter-spacing: .02em; color: var(--fg); }
  .step { font-family: var(--mono); font-size: 15px; color: var(--muted); margin-left: auto; }

  h1 { font-family: var(--serif); font-weight: 600; font-size: 40px; line-height: 1.15;
       margin: 34px 0 10px; letter-spacing: -.01em; }
  .sub { font-family: var(--serif); font-size: 21px; color: var(--muted); margin: 0 0 26px; line-height: 1.45; }

  .panel { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 6px;
           padding: 22px 26px; font-family: var(--mono); font-size: 17px; line-height: 1.75;
           flex: 1; overflow: hidden; white-space: pre-wrap; }
  .panel .dim { color: var(--muted); }
  .panel .deny { color: var(--deny); }
  .panel .allow { color: var(--allow); }
  .panel .accent { color: var(--accent); }
  .panel .fg { color: var(--fg); }

  footer { margin-top: 22px; border-top: 1px solid var(--rule); padding-top: 16px;
           font-family: var(--mono); font-size: 15px; color: var(--muted);
           display: flex; justify-content: space-between; }

  /* Title card: a different shape, so the end reads as an end. */
  body.title { justify-content: center; align-items: center; text-align: center; padding: 0 120px; }
  body.title header, body.title footer { display: none; }
  body.title h1 { font-size: 56px; margin: 0 0 18px; }
  body.title .sub { font-size: 24px; margin-bottom: 40px; }
  /* The panel sizes to its content here instead of filling the column, so the commands
     are not clipped by the flex rule that makes them fill on the other layouts. */
  body.title .panel { flex: 0 0 auto; height: auto; overflow: visible;
                      text-align: left; font-size: 19px; width: 100%;
                      padding: 26px 32px; line-height: 2; }
</style>
</head>
<body>
  <header>
    <span class="wordmark">lld-seed</span>
    <span class="step" id="step"></span>
  </header>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="panel" id="panel"></div>
  <footer>
    <span id="foot-left"></span>
    <span id="foot-right"></span>
  </footer>

<!--SCENE_DATA-->
<script>
  (function () {
    var s = window.SCENE || {};
    if (s.theme === "light") document.documentElement.setAttribute("data-theme", "light");
    if (s.layout === "title") document.body.classList.add("title");
    document.getElementById("step").textContent = s.step || "";
    document.getElementById("title").textContent = s.title || "";
    document.getElementById("sub").textContent = s.sub || "";
    document.getElementById("panel").innerHTML = (s.lines || []).join("\n");
    document.getElementById("foot-left").textContent = s.footLeft || "";
    document.getElementById("foot-right").textContent = s.footRight || "";
  })();
</script>
</body>
</html>
