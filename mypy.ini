# Type checking. Strict in the package; relaxed where strictness buys nothing.
# python-style/SKILL.md names this as the owner of annotation and optionality rules, so
# none of them appear in the markdown.

[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
warn_no_return = True
show_error_codes = True
pretty = True

# Tests assert on values, not types; fixtures are routinely untyped by design.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_untyped_decorators = False

# Third-party packages without stubs: report the missing stub once, not at every use.
[mypy-numpy.*]
ignore_missing_imports = True
[mypy-pytest.*]
ignore_missing_imports = True
